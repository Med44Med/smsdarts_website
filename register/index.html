<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/images/smsdarts.png" />
    <title>SMSDarts | Sign Up</title>
    <style type="text/tailwindcss">
      @theme {
        --color-primary: #3cc037;
        --color-primary-hover: oklch(62.7% 0.194 149.214);
        --color-text: #e9e9e9;
        --color-text-secondary: #a1a1a1;
        --color-background: #1d1d1d;
        --color-surface: #242424;
        --color-surface-secondary: #2d2d2d;
        --: "Montserrat", sans-serif;
        --font-playfair: "Playfair Display", serif;
      }
      :root {
        --background: #1d1d1d;
        --surface: #242424;
        --surface-secondary: #2d2d2d;
        --primary: #3cc037;
        --primary-hover: oklch(62.7% 0.194 149.214);

        --text: #e9e9e9;
        --text-secondary: #a1a1a1;
      }

      html[theme="light"] {
        --background: #dee4df;
        --surface: #f7f6f6;
        --surface-secondary: #ffffff;

        --text: #242424;
        --text-secondary: #5c5c5c;
      }
    </style>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="/style.css" />
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="/supabase.js"></script>
    <script src="/register/register.js" defer></script>
    <script src="/register/app.js"></script>
  </head>
  <body
    class="bg-background flex flex-col items-center justify-start h-screen p-10"
  >
    <div class="w-full flex justify-start items-start">
      <a href="javascript:history.back()"
        ><i
          class="fa-solid fa-arrow-left text-text text-2xl hover:text-primary"
        ></i
      ></a>
    </div>
    <div class="flex justify-center items-center gap-2">
      <img src="../images/smsdarts.png" alt="" class="w-16 h-auto" />
      <h1 class="text-text text-2xl font-black text-center">
        SMS<span class="text-primary">Darts</span>
      </h1>
    </div>
    <div class="flex justify-center items-center gap-2 my-5">
      <h1 class="text-text text-2xl font-black text-center">Page d'inscription</h1>
    </div>
    <form
      action="/register"
      method="POST"
      class="bg-surface w-full max-w-3xl p-8 rounded-2xl shadow-lg flex flex-col items-center gap-4"
    >
      <div class="w-full md:w-2/3">
        <label for="email" class="block text-sm font-medium text-text"
          >Nom d'utilisateur</label
        >
        <input
          type="text"
          id="username"
          name="username"
          required
          class="text-text mt-1 block w-full px-3 py-2 bg-surface-secondary border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary"
        />
      </div>
      <div class="w-full md:w-2/3">
        <label for="email" class="block text-sm font-medium text-text"
          >Email</label
        >
        <input
          type="email"
          id="email"
          name="email"
          required
          class="text-text mt-1 block w-full px-3 py-2 bg-surface-secondary border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary"
        />
      </div>
      <div class="w-full md:w-2/3 flex flex-col items-end">
        <label for="password" class="w-full block text-sm font-medium text-text"
          >Mot de passe</label
        >
        <input
          type="password"
          id="password"
          name="password"
          required
          class="text-text mt-1 block w-full px-3 py-2 bg-surface-secondary border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary"
        />
      </div>
      <div class="w-full md:w-2/3 flex flex-col items-end">
        <label for="password" class="w-full block text-sm font-medium text-text"
          >Confirmez le mot de passe</label
        >
        <input
          type="password"
          id="confirm-password"
          name="confirm-password"
          required
          class="text-text mt-1 block w-full px-3 py-2 bg-surface-secondary border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary"
        />
      </div>
      <div class="w-full md:w-2/3 mt-auto flex flex-col items-center gap-3">
        <p id="errorMsg" class="text-red-500 text-sm"></p>
        <button
          id="registerBtn"
          type="submit"
          class="w-full cursor-pointer py-2 px-4 bg-primary hover:bg-primary-hover text-white font-semibold rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2"
        >
          S'inscrire
        </button>
        <button
          type="button"
          onclick="signUpWithGoogle()"
          class="flex justify-center items-center gap-2 w-full cursor-pointer py-2 px-4 bg-surface-secondary hover:bg-surface-secondary/80 text-white font-semibold rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2"
        >
          <i class="fa-brands fa-google text-xl"></i> Inscrivez-vous avec Google
        </button>
      </div>
    </form>
    <p class="w-full max-w-3xl mt-3 text-end text-text text-sm">
      Vous avez déjà un compte ?
      <a
        href="/fr/login"
        class="text-primary hover:text-primary-hover transition duration-300"
        >Se connecter</a
      >
    </p>
    <div class="py-10">
      <p class="text-text font-bold">SMSDarts - 2026</p>
    </div>
  </body>
</html>
